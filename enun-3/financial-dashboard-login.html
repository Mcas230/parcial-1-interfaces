<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en tu dashboard financiero.">

    <title>Login | Financial Dashboard</title>

    <link rel="stylesheet" href="financial-dashboard-mainstyles.css">
</head>

<body>
    <main class="mainContainer">
        <section class="loginBox">
            <h1 class="loginTitle">Welcome</h1>
            <p class="loginSubtitle">plz Login</p>

            <form>
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <a class="loginButton" href="financial-dashboard-main.html">
                    Login
                </a>
            </form>
        </section>

        <section class="loginMessage">
            <h2>Control your future, penny by penny.</h2>
        </section>
    </main>
</body>
</html>
